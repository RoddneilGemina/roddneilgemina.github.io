<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="50%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg8)"/>
  <g filter="url(#shadow8)" transform="translate(40, 30)">
    <rect width="720" height="34" rx="8" ry="8" fill="#44403c"/>
    <rect y="26" width="720" height="330" fill="#1c1917"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#eab308"/>
    <circle cx="52" cy="17" r="5" fill="#22c55e"/>
    <text x="360" y="21" fill="#fdba74" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">nexchef.app — Live Synchronized Cooking Timers</text>

    <!-- Main Cooking Step Card -->
    <rect x="25" y="45" width="440" height="295" rx="8" fill="#292524" stroke="#f97316" stroke-width="1.5"/>
    <text x="45" y="75" fill="#fb923c" font-family="sans-serif" font-size="13" font-weight="bold">STEP 2 OF 4: SIMMER TOMATO SAUCE</text>
    
    <text x="45" y="105" fill="#e7e5e4" font-family="sans-serif" font-size="12">Maintain medium-low heat and stir garlic &amp; crushed tomatoes.</text>

    <!-- Synchronized Live Timer Circle -->
    <circle cx="245" cy="200" r="60" fill="none" stroke="#44403c" stroke-width="8"/>
    <circle cx="245" cy="200" r="60" fill="none" stroke="#f97316" stroke-width="8" stroke-dasharray="377" stroke-dashoffset="100"/>
    <text x="245" y="206" fill="#ffffff" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">04:30</text>
    <text x="245" y="224" fill="#fdba74" font-family="sans-serif" font-size="10" text-anchor="middle">TIMER RUNNING</text>

    <!-- Right Sidebar Ingredient Scaler -->
    <rect x="480" y="45" width="215" height="295" rx="8" fill="#292524" stroke="rgba(255,255,255,0.1)"/>
    <text x="495" y="75" fill="#f97316" font-family="sans-serif" font-size="12" font-weight="bold">DYNAMIC INGREDIENTS</text>
    <text x="495" y="100" fill="#a8a29e" font-family="sans-serif" font-size="10">Servings: 4 (Auto-Scaled)</text>

    <text x="495" y="130" fill="#e7e5e4" font-family="sans-serif" font-size="11">✓ 500g Pasta</text>
    <text x="495" y="155" fill="#e7e5e4" font-family="sans-serif" font-size="11">✓ 4 cloves Garlic (Minced)</text>
    <text x="495" y="180" fill="#e7e5e4" font-family="sans-serif" font-size="11">✓ 2 cans Crushed Tomatoes</text>
    <text x="495" y="205" fill="#e7e5e4" font-family="sans-serif" font-size="11">✓ 3 tbsp Olive Oil</text>
  </g>

  <!-- Overlay Placeholder Watermark/Badge -->
  <g transform="translate(400, 225)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="rgba(41, 37, 36, 0.88)" stroke="#f97316" stroke-width="2"/>
    <circle cx="-145" cy="0" r="12" fill="#ff7043"/>
    <polygon points="-149,-5 -149,5 -139,0" fill="#ffffff"/>
    <text x="10" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">📷 Demo Screenshot / Video Placeholder</text>
  </g>
</svg>
