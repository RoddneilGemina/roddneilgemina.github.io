<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_hydro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow_hydro" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg_hydro)"/>
  <g filter="url(#shadow_hydro)" transform="translate(40, 30)">
    <rect width="720" height="34" rx="8" ry="8" fill="#0369a1"/>
    <rect y="26" width="720" height="330" fill="#0f172a"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#eab308"/>
    <circle cx="52" cy="17" r="5" fill="#22c55e"/>
    <text x="360" y="21" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">hydroponics-research.local — Aerated vs Non-aerated Study</text>

    <!-- Comparison Left Box (Aerated) -->
    <rect x="25" y="45" width="325" height="295" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="45" y="75" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">AERATED HYDROPONICS</text>
    <text x="45" y="98" fill="#4ade80" font-family="sans-serif" font-size="11">✓ Dissolved O₂ Bubbles Active</text>
    
    <!-- Water Spinach Plant Graphic (Aerated - Lush) -->
    <g transform="translate(180, 220)">
      <!-- Water Basin -->
      <rect x="-100" y="30" width="200" height="50" rx="6" fill="#0284c7" opacity="0.6"/>
      <circle cx="-50" cy="55" r="4" fill="#7dd3fc"/>
      <circle cx="-20" cy="45" r="6" fill="#7dd3fc"/>
      <circle cx="30" cy="60" r="5" fill="#7dd3fc"/>
      <!-- Stems & Leaves -->
      <path d="M 0 30 Q -20 -30 -40 -80" fill="none" stroke="#22c55e" stroke-width="4"/>
      <path d="M 0 30 Q 0 -40 10 -90" fill="none" stroke="#22c55e" stroke-width="4"/>
      <path d="M 0 30 Q 20 -20 50 -70" fill="none" stroke="#22c55e" stroke-width="4"/>
      <circle cx="-40" cy="-80" r="14" fill="#4ade80"/>
      <circle cx="10" cy="-90" r="16" fill="#4ade80"/>
      <circle cx="50" cy="-70" r="15" fill="#4ade80"/>
    </g>
    <text x="180" y="315" fill="#f8fafc" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">Growth Rate: +145% Leaf Biomass</text>

    <!-- Comparison Right Box (Non-Aerated) -->
    <rect x="370" y="45" width="325" height="295" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="390" y="75" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="bold">NON-AERATED SETUP</text>
    <text x="390" y="98" fill="#f87171" font-family="sans-serif" font-size="11">⚠ Stagnant Solution (Control)</text>

    <!-- Water Spinach Plant Graphic (Non-Aerated - Smaller) -->
    <g transform="translate(530, 220)">
      <rect x="-100" y="30" width="200" height="50" rx="6" fill="#334155"/>
      <path d="M 0 30 Q -10 -15 -20 -50" fill="none" stroke="#65a30d" stroke-width="3"/>
      <path d="M 0 30 Q 10 -10 25 -45" fill="none" stroke="#65a30d" stroke-width="3"/>
      <circle cx="-20" cy="-50" r="9" fill="#84cc16"/>
      <circle cx="25" cy="-45" r="10" fill="#84cc16"/>
    </g>
    <text x="532" y="315" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Baseline Growth (Water Spinach)</text>
  </g>

  <!-- Overlay Placeholder Watermark/Badge -->
  <g transform="translate(400, 225)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="rgba(15, 23, 42, 0.88)" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-145" cy="0" r="12" fill="#ff7043"/>
    <polygon points="-149,-5 -149,5 -139,0" fill="#ffffff"/>
    <text x="10" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">📷 Demo Screenshot / Video Placeholder</text>
  </g>
</svg>
