<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg7)"/>
  <g filter="url(#shadow7)" transform="translate(40, 30)">
    <rect width="720" height="34" rx="8" ry="8" fill="#1e293b"/>
    <rect y="26" width="720" height="330" fill="#0f172a"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#eab308"/>
    <circle cx="52" cy="17" r="5" fill="#22c55e"/>
    <text x="360" y="21" fill="#a3e635" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">e-tanom.org — AgriTech Crop Demand Analytics</text>

    <!-- Main Chart Window -->
    <rect x="25" y="45" width="440" height="295" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="45" y="75" fill="#bef264" font-family="sans-serif" font-size="13" font-weight="bold">SEASONAL CROP DEMAND ANALYTICS</text>
    
    <!-- Graph Lines -->
    <polyline points="50,260 110,220 170,240 230,150 290,180 350,110 410,130" fill="none" stroke="#a3e635" stroke-width="3"/>
    <circle cx="230" cy="150" r="5" fill="#a3e635"/>
    <circle cx="350" cy="110" r="5" fill="#a3e635"/>
    <text x="350" y="95" fill="#bef264" font-family="sans-serif" font-size="10" text-anchor="middle">Peak Demand</text>

    <!-- X-Axis Labels -->
    <text x="50" y="285" fill="#94a3b8" font-family="sans-serif" font-size="10">Jan</text>
    <text x="110" y="285" fill="#94a3b8" font-family="sans-serif" font-size="10">Mar</text>
    <text x="170" y="285" fill="#94a3b8" font-family="sans-serif" font-size="10">May</text>
    <text x="230" y="285" fill="#94a3b8" font-family="sans-serif" font-size="10">Jul</text>
    <text x="290" y="285" fill="#94a3b8" font-family="sans-serif" font-size="10">Sep</text>
    <text x="350" y="285" fill="#94a3b8" font-family="sans-serif" font-size="10">Nov</text>

    <!-- Right Sidebar Widgets -->
    <rect x="480" y="45" width="215" height="140" rx="8" fill="#1e293b"/>
    <text x="495" y="70" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">TOP CROP DISTRIBUTION</text>
    <text x="495" y="95" fill="#cbd5e1" font-family="sans-serif" font-size="11">1. Yellow Corn — 42%</text>
    <text x="495" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="11">2. Lowland Vegetables — 33%</text>
    <text x="495" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="11">3. Rice &amp; Grains — 25%</text>

    <rect x="480" y="195" width="215" height="145" rx="8" fill="#1e293b"/>
    <text x="495" y="220" fill="#84cc16" font-family="sans-serif" font-size="12" font-weight="bold">FARMER GUIDANCE</text>
    <text x="495" y="245" fill="#cbd5e1" font-family="sans-serif" font-size="11">"Plant Corn in May for peak Q3 market price yield."</text>
  </g>

  <!-- Overlay Placeholder Watermark/Badge -->
  <g transform="translate(400, 225)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="rgba(15, 23, 42, 0.88)" stroke="#84cc16" stroke-width="2"/>
    <circle cx="-145" cy="0" r="12" fill="#ff7043"/>
    <polygon points="-149,-5 -149,5 -139,0" fill="#ffffff"/>
    <text x="10" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">📷 Demo Screenshot / Video Placeholder</text>
  </g>
</svg>
