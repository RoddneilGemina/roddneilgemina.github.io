<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#311b92"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg2)"/>
  <pattern id="grid2" width="25" height="25" patternUnits="userSpaceOnUse">
    <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid2)"/>

  <g filter="url(#shadow2)" transform="translate(40, 30)">
    <!-- Window Header -->
    <rect width="720" height="34" rx="8" ry="8" fill="#1e1b4b"/>
    <rect y="26" width="720" height="330" fill="#0f172a"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#eab308"/>
    <circle cx="52" cy="17" r="5" fill="#22c55e"/>
    <text x="360" y="21" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">visual-ai-ocr.local — Visual AI Logic Proof Scanner</text>

    <!-- Scan Canvas Area -->
    <rect x="20" y="45" width="440" height="295" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="35" y="70" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="bold">[OCR CANVAS LIVE SCAN]</text>

    <!-- Simulated Handwritten Proof Lines -->
    <!-- Line 1 -->
    <text x="50" y="110" fill="#f8fafc" font-family="serif" font-size="18" font-style="italic">1. P → (Q ∧ R)</text>
    <rect x="42" y="90" width="180" height="30" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="230" y="110" fill="#4ade80" font-family="sans-serif" font-size="10">✓ Premise 1</text>

    <!-- Line 2 -->
    <text x="50" y="160" fill="#f8fafc" font-family="serif" font-size="18" font-style="italic">2. P</text>
    <rect x="42" y="140" width="80" height="30" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="130" y="160" fill="#4ade80" font-family="sans-serif" font-size="10">✓ Premise 2</text>

    <!-- Line 3 -->
    <text x="50" y="210" fill="#f8fafc" font-family="serif" font-size="18" font-style="italic">3. ∴ Q ∧ R</text>
    <rect x="42" y="190" width="150" height="32" fill="none" stroke="#a855f7" stroke-width="2"/>
    <text x="200" y="210" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold">Modus Ponens (1,2)</text>

    <!-- Scanning laser animation bar -->
    <line x1="20" y1="245" x2="460" y2="245" stroke="#ec4899" stroke-width="3"/>

    <!-- Right Evaluation Panel -->
    <rect x="475" y="45" width="225" height="295" rx="6" fill="#18181b" stroke="rgba(255,255,255,0.1)"/>
    <text x="490" y="70" fill="#e879f9" font-family="sans-serif" font-size="12" font-weight="bold">PROOF EVALUATION</text>
    <text x="490" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="11">Total Score: 100 / 100</text>
    <text x="490" y="125" fill="#cbd5e1" font-family="sans-serif" font-size="11">Rule Accuracy: 100%</text>
    <text x="490" y="150" fill="#cbd5e1" font-family="sans-serif" font-size="11">Handwriting Confidence:</text>
    <rect x="490" y="160" width="190" height="8" rx="4" fill="#3f3f46"/>
    <rect x="490" y="160" width="180" height="8" rx="4" fill="#c084fc"/>
    <text x="490" y="190" fill="#4ade80" font-family="sans-serif" font-size="11">✓ All steps logically sound</text>
  </g>

  <!-- Overlay Placeholder Watermark/Badge -->
  <g transform="translate(400, 225)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="rgba(30, 27, 75, 0.88)" stroke="#a855f7" stroke-width="2"/>
    <circle cx="-145" cy="0" r="12" fill="#ff7043"/>
    <polygon points="-149,-5 -149,5 -139,0" fill="#ffffff"/>
    <text x="10" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">📷 Demo Screenshot / Video Placeholder</text>
  </g>
</svg>
