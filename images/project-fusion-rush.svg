<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bg1)"/>
  <pattern id="grid1" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid1)"/>

  <!-- Application Window Mockup -->
  <g filter="url(#shadow1)" transform="translate(40, 30)">
    <!-- Window Bar -->
    <rect width="720" height="34" rx="8" ry="8" fill="#1e293b"/>
    <rect y="26" width="720" height="330" fill="#0f172a"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#eab308"/>
    <circle cx="52" cy="17" r="5" fill="#22c55e"/>
    <text x="360" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">fusion-rush-demo.local — AI Discrete Math Solver</text>
    
    <!-- UI Layout Grid -->
    <!-- Left Sidebar -->
    <rect x="15" y="45" width="180" height="300" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="30" y="70" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">RULES OF INFERENCE</text>
    <rect x="25" y="85" width="160" height="28" rx="4" fill="#0284c7" opacity="0.3"/>
    <text x="35" y="103" fill="#e0f2fe" font-family="sans-serif" font-size="11">✓ Modus Ponens (p→q)</text>
    <rect x="25" y="120" width="160" height="28" rx="4" fill="rgba(255,255,255,0.05)"/>
    <text x="35" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11">Modus Tollens (¬q→¬p)</text>
    <rect x="25" y="155" width="160" height="28" rx="4" fill="rgba(255,255,255,0.05)"/>
    <text x="35" y="173" fill="#94a3b8" font-family="sans-serif" font-size="11">Hypothetical Syllogism</text>

    <!-- Main Workspace -->
    <rect x="210" y="45" width="495" height="190" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="230" y="75" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Gamified Logic Proof Graph</text>
    
    <!-- Logic Graph Nodes -->
    <circle cx="280" cy="140" r="22" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="280" y="145" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">p → q</text>

    <line x1="302" y1="140" x2="388" y2="140" stroke="#06b6d4" stroke-width="3" stroke-dasharray="4"/>

    <circle cx="410" cy="140" r="22" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="410" y="145" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">q → r</text>

    <line x1="432" y1="140" x2="518" y2="140" stroke="#06b6d4" stroke-width="3"/>

    <circle cx="540" cy="140" r="24" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <text x="540" y="145" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">∴ p → r</text>

    <!-- AI Tutor Feedback -->
    <rect x="210" y="248" width="495" height="97" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="230" y="273" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">🤖 AI TUTOR REAL-TIME VERIFICATION</text>
    <text x="230" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="11">"Step 3 verified! Hypothetical Syllogism correctly applied to premises 1 &amp; 2. +150 XP"</text>
    <rect x="230" y="308" width="300" height="12" rx="6" fill="#1e293b"/>
    <rect x="230" y="308" width="240" height="12" rx="6" fill="url(#glow1)"/>
    <text x="540" y="318" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">80% Mastery</text>
  </g>

  <!-- Overlay Placeholder Watermark/Badge -->
  <g transform="translate(400, 225)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="rgba(15, 23, 42, 0.85)" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="-145" cy="0" r="12" fill="#ff7043"/>
    <polygon points="-149,-5 -149,5 -139,0" fill="#ffffff"/>
    <text x="10" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">📷 Demo Screenshot / Video Placeholder</text>
  </g>
</svg>
