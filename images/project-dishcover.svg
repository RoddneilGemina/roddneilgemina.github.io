<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg4)"/>
  <g filter="url(#shadow4)" transform="translate(40, 30)">
    <rect width="720" height="34" rx="8" ry="8" fill="#064e3b"/>
    <rect y="26" width="720" height="330" fill="#022c22"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#eab308"/>
    <circle cx="52" cy="17" r="5" fill="#22c55e"/>
    <text x="360" y="21" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">dishcover.app — Smart Pantry &amp; Food Expiry Tracker</text>

    <!-- Left Pantry Grid -->
    <rect x="20" y="45" width="420" height="295" rx="8" fill="#064e3b" stroke="rgba(255,255,255,0.1)"/>
    <text x="35" y="70" fill="#a7f3d0" font-family="sans-serif" font-size="13" font-weight="bold">MY PANTRY STOCK &amp; EXPIRATION</text>

    <!-- Item 1 -->
    <rect x="35" y="85" width="390" height="48" rx="6" fill="#022c22"/>
    <text x="50" y="105" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Fresh Milk (2L)</text>
    <text x="50" y="122" fill="#fbbf24" font-family="sans-serif" font-size="10">⚠️ Expires in 2 Days</text>
    <rect x="330" y="98" width="80" height="22" rx="11" fill="#f59e0b"/>
    <text x="370" y="113" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Use Soon</text>

    <!-- Item 2 -->
    <rect x="35" y="142" width="390" height="48" rx="6" fill="#022c22"/>
    <text x="50" y="162" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Organic Eggs (12 pcs)</text>
    <text x="50" y="179" fill="#34d399" font-family="sans-serif" font-size="10">✓ Expires in 12 Days</text>
    <rect x="330" y="155" width="80" height="22" rx="11" fill="#10b981"/>
    <text x="370" y="170" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Fresh</text>

    <!-- Item 3 -->
    <rect x="35" y="199" width="390" height="48" rx="6" fill="#022c22"/>
    <text x="50" y="219" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Cheddar Cheese Block</text>
    <text x="50" y="236" fill="#34d399" font-family="sans-serif" font-size="10">✓ Expires in 18 Days</text>
    <rect x="330" y="212" width="80" height="22" rx="11" fill="#10b981"/>
    <text x="370" y="227" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Fresh</text>

    <!-- Right Recipe Generator -->
    <rect x="455" y="45" width="245" height="295" rx="8" fill="#064e3b"/>
    <text x="470" y="70" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">SUGGESTED RECIPE</text>
    <rect x="470" y="85" width="215" height="110" rx="6" fill="#022c22"/>
    <text x="485" y="110" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Creamy Omelette</text>
    <text x="485" y="130" fill="#a7f3d0" font-family="sans-serif" font-size="10">Uses your expiring Milk &amp; Eggs!</text>
    <rect x="485" y="150" width="120" height="28" rx="4" fill="#10b981"/>
    <text x="545" y="168" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cook Recipe</text>
  </g>

  <!-- Overlay Placeholder Watermark/Badge -->
  <g transform="translate(400, 225)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="rgba(6, 78, 59, 0.88)" stroke="#34d399" stroke-width="2"/>
    <circle cx="-145" cy="0" r="12" fill="#ff7043"/>
    <polygon points="-149,-5 -149,5 -139,0" fill="#ffffff"/>
    <text x="10" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">📷 Demo Screenshot / Video Placeholder</text>
  </g>
</svg>
