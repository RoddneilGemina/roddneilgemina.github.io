<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)"/>
  <g filter="url(#shadow3)" transform="translate(40, 30)">
    <rect width="720" height="34" rx="8" ry="8" fill="#27272a"/>
    <rect y="26" width="720" height="330" fill="#09090b"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#eab308"/>
    <circle cx="52" cy="17" r="5" fill="#22c55e"/>
    <text x="360" y="21" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">takeit-events.com — Ticketing &amp; Event Booking</text>

    <!-- Event Hero Banner Card -->
    <rect x="20" y="45" width="450" height="150" rx="8" fill="#18181b" stroke="#f43f5e" stroke-width="1"/>
    <rect x="20" y="45" width="450" height="150" rx="8" fill="rgba(244,63,94,0.15)"/>
    <text x="40" y="80" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="800">Cebu Tech &amp; Music Festival 2026</text>
    <text x="40" y="105" fill="#fda4af" font-family="sans-serif" font-size="12">Grand Ballroom • Nov 14, 2026</text>
    <rect x="40" y="125" width="130" height="32" rx="16" fill="#f43f5e"/>
    <text x="105" y="145" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Book Ticket</text>

    <!-- Right Ticket Preview Card -->
    <rect x="485" y="45" width="215" height="295" rx="8" fill="#18181b" stroke="rgba(255,255,255,0.1)"/>
    <text x="500" y="75" fill="#f43f5e" font-family="sans-serif" font-size="12" font-weight="bold">YOUR DIGITAL TICKET</text>
    <!-- QR Code Mock -->
    <rect x="522" y="95" width="140" height="140" fill="#ffffff" rx="6"/>
    <rect x="537" y="110" width="45" height="45" fill="#09090b"/>
    <rect x="602" y="110" width="45" height="45" fill="#09090b"/>
    <rect x="537" y="175" width="45" height="45" fill="#09090b"/>
    <rect x="592" y="165" width="25" height="25" fill="#09090b"/>
    <text x="592" y="260" fill="#a1a1aa" font-family="monospace" font-size="10" text-anchor="middle">TKT-8849201-2026</text>
    <text x="592" y="280" fill="#22c55e" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">✓ Confirmed &amp; Paid</text>

    <!-- Bottom Seat Map Grid -->
    <rect x="20" y="205" width="450" height="135" rx="8" fill="#18181b"/>
    <text x="35" y="230" fill="#e4e4e7" font-family="sans-serif" font-size="12" font-weight="bold">Interactive Seat Selection</text>
    <g transform="translate(35, 245)">
      <circle cx="15" cy="15" r="10" fill="#f43f5e"/>
      <circle cx="45" cy="15" r="10" fill="#f43f5e"/>
      <circle cx="75" cy="15" r="10" fill="#3f3f46"/>
      <circle cx="105" cy="15" r="10" fill="#3f3f46"/>
      <circle cx="135" cy="15" r="10" fill="#f43f5e"/>
      <circle cx="165" cy="15" r="10" fill="#3f3f46"/>
      <circle cx="195" cy="15" r="10" fill="#3f3f46"/>
      
      <circle cx="15" cy="45" r="10" fill="#3f3f46"/>
      <circle cx="45" cy="45" r="10" fill="#f43f5e"/>
      <circle cx="75" cy="45" r="10" fill="#f43f5e"/>
      <circle cx="105" cy="45" r="10" fill="#3f3f46"/>
      <circle cx="135" cy="45" r="10" fill="#3f3f46"/>
      <circle cx="165" cy="45" r="10" fill="#f43f5e"/>
      <circle cx="195" cy="45" r="10" fill="#3f3f46"/>
    </g>
  </g>

  <!-- Overlay Placeholder Watermark/Badge -->
  <g transform="translate(400, 225)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="rgba(24, 24, 27, 0.88)" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="-145" cy="0" r="12" fill="#ff7043"/>
    <polygon points="-149,-5 -149,5 -139,0" fill="#ffffff"/>
    <text x="10" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">📷 Demo Screenshot / Video Placeholder</text>
  </g>
</svg>
