<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg6)"/>
  <g filter="url(#shadow6)" transform="translate(40, 30)">
    <rect width="720" height="34" rx="8" ry="8" fill="#18181b"/>
    <rect y="26" width="720" height="330" fill="#09090b"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#eab308"/>
    <circle cx="52" cy="17" r="5" fill="#22c55e"/>
    <text x="360" y="21" fill="#eab308" font-family="monospace" font-size="11" text-anchor="middle" font-weight="600">bomberman-pvp.local — Java Multiplayer Game Loop (60 FPS)</text>

    <!-- Retro 2D Grid Arena -->
    <rect x="25" y="45" width="460" height="295" rx="6" fill="#1c1917" stroke="#eab308" stroke-width="1.5"/>
    <g transform="translate(45, 65)">
      <!-- Tile Grid -->
      <pattern id="arcade-grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="#292524" stroke="#44403c" stroke-width="1"/>
      </pattern>
      <rect width="420" height="255" fill="url(#arcade-grid)"/>

      <!-- Indestructible Pillars -->
      <rect x="40" y="40" width="40" height="40" fill="#78716c"/>
      <rect x="120" y="40" width="40" height="40" fill="#78716c"/>
      <rect x="200" y="40" width="40" height="40" fill="#78716c"/>
      <rect x="280" y="40" width="40" height="40" fill="#78716c"/>
      
      <rect x="40" y="120" width="40" height="40" fill="#78716c"/>
      <rect x="120" y="120" width="40" height="40" fill="#78716c"/>
      <rect x="200" y="120" width="40" height="40" fill="#78716c"/>
      <rect x="280" y="120" width="40" height="40" fill="#78716c"/>

      <!-- Active Bomb & Explosion Radius -->
      <circle cx="180" cy="180" r="16" fill="#000000" stroke="#ef4444" stroke-width="3"/>
      <path d="M 180 164 Q 185 155 190 150" fill="none" stroke="#eab308" stroke-width="3"/>
      <circle cx="190" cy="150" r="4" fill="#ef4444"/>

      <!-- Player 1 Sprite -->
      <circle cx="20" cy="20" r="14" fill="#3b82f6"/>
      <text x="20" y="24" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">P1</text>

      <!-- Player 2 Sprite -->
      <circle cx="380" cy="220" r="14" fill="#ef4444"/>
      <text x="380" y="224" fill="#fff" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">P2</text>
    </g>

    <!-- Right Live Multiplayer Stats -->
    <rect x="500" y="45" width="195" height="295" rx="6" fill="#1c1917" stroke="rgba(255,255,255,0.1)"/>
    <text x="515" y="75" fill="#facc15" font-family="monospace" font-size="12" font-weight="bold">SOCKET STATUS</text>
    <text x="515" y="105" fill="#4ade80" font-family="monospace" font-size="11">● Connected (Server)</text>
    <text x="515" y="130" fill="#a1a1aa" font-family="monospace" font-size="11">Ping: 14 ms</text>
    <text x="515" y="155" fill="#a1a1aa" font-family="monospace" font-size="11">Players: 2/4 Active</text>
    
    <text x="515" y="195" fill="#ef4444" font-family="monospace" font-size="12" font-weight="bold">SAFE ZONE</text>
    <text x="515" y="220" fill="#fca5a5" font-family="monospace" font-size="11">Shrinking in 15s!</text>
  </g>

  <!-- Overlay Placeholder Watermark/Badge -->
  <g transform="translate(400, 225)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="rgba(28, 25, 23, 0.88)" stroke="#eab308" stroke-width="2"/>
    <circle cx="-145" cy="0" r="12" fill="#ff7043"/>
    <polygon points="-149,-5 -149,5 -139,0" fill="#ffffff"/>
    <text x="10" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">📷 Demo Screenshot / Video Placeholder</text>
  </g>
</svg>
