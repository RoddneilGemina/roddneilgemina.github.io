<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg5)"/>
  <g filter="url(#shadow5)" transform="translate(40, 30)">
    <rect width="720" height="34" rx="8" ry="8" fill="#14532d"/>
    <rect y="26" width="720" height="330" fill="#052e16"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#eab308"/>
    <circle cx="52" cy="17" r="5" fill="#22c55e"/>
    <text x="360" y="21" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" font-weight="600">cropconnect.ph — Direct Farmer Marketplace</text>

    <!-- Marketplace Header -->
    <text x="25" y="65" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">Fresh Produce Direct from Local Farmers</text>

    <!-- Product Card 1 -->
    <rect x="25" y="85" width="215" height="240" rx="8" fill="#14532d" stroke="rgba(255,255,255,0.1)"/>
    <rect x="35" y="95" width="195" height="100" rx="6" fill="#22c55e" opacity="0.3"/>
    <text x="132" y="150" fill="#4ade80" font-family="sans-serif" font-size="28" text-anchor="middle">🌽</text>
    <text x="40" y="215" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Sweet Yellow Corn</text>
    <text x="40" y="235" fill="#86efac" font-family="sans-serif" font-size="11">Farmer: Juan (Argao)</text>
    <text x="40" y="260" fill="#facc15" font-family="sans-serif" font-size="14" font-weight="bold">₱45.00 / kg</text>
    <rect x="40" y="280" width="185" height="30" rx="4" fill="#22c55e"/>
    <text x="132" y="300" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Buy Direct</text>

    <!-- Product Card 2 -->
    <rect x="255" y="85" width="215" height="240" rx="8" fill="#14532d" stroke="rgba(255,255,255,0.1)"/>
    <rect x="265" y="95" width="195" height="100" rx="6" fill="#22c55e" opacity="0.3"/>
    <text x="362" y="150" fill="#4ade80" font-family="sans-serif" font-size="28" text-anchor="middle">🍅</text>
    <text x="270" y="215" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Organic Tomatoes</text>
    <text x="270" y="235" fill="#86efac" font-family="sans-serif" font-size="11">Farmer: Maria (Dalaguete)</text>
    <text x="270" y="260" fill="#facc15" font-family="sans-serif" font-size="14" font-weight="bold">₱60.00 / kg</text>
    <rect x="270" y="280" width="185" height="30" rx="4" fill="#22c55e"/>
    <text x="362" y="300" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Buy Direct</text>

    <!-- Product Card 3 -->
    <rect x="485" y="85" width="210" height="240" rx="8" fill="#14532d" stroke="rgba(255,255,255,0.1)"/>
    <rect x="495" y="95" width="190" height="100" rx="6" fill="#22c55e" opacity="0.3"/>
    <text x="590" y="150" fill="#4ade80" font-family="sans-serif" font-size="28" text-anchor="middle">🥭</text>
    <text x="500" y="215" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Carabao Mangoes</text>
    <text x="500" y="235" fill="#86efac" font-family="sans-serif" font-size="11">Farmer: Pedro (Carcar)</text>
    <text x="500" y="260" fill="#facc15" font-family="sans-serif" font-size="14" font-weight="bold">₱120.00 / kg</text>
    <rect x="500" y="280" width="180" height="30" rx="4" fill="#22c55e"/>
    <text x="590" y="300" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Buy Direct</text>
  </g>

  <!-- Overlay Placeholder Watermark/Badge -->
  <g transform="translate(400, 225)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="rgba(20, 83, 45, 0.88)" stroke="#4ade80" stroke-width="2"/>
    <circle cx="-145" cy="0" r="12" fill="#ff7043"/>
    <polygon points="-149,-5 -149,5 -139,0" fill="#ffffff"/>
    <text x="10" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">📷 Demo Screenshot / Video Placeholder</text>
  </g>
</svg>
